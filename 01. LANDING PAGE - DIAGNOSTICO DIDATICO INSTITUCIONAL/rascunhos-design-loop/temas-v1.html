<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temas v1 — Diagnóstico Didático Institucional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #14140f;
        --ink-soft: #5a564c;
        --paper: #f7f2e6;
        --chalk: #fffdf7;
        --stone: #e2dbca;
        --highlight: #fbe36a;
        --cobalt: #2454ff;
        --cobalt-dark: #173aad;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Archivo", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      .section {
        padding: clamp(72px, 8vw, 120px) clamp(16px, 4vw, 56px);
      }

      .inner {
        width: min(1180px, 100%);
        margin: 0 auto;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 16px;
        height: 4px;
        background: var(--ink-soft);
        content: "";
      }

      h2 {
        margin: 0;
        max-width: 820px;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(34px, 5vw, 52px);
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.05;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 16px 28px;
        font-weight: 800;
        letter-spacing: -0.005em;
        text-decoration: none;
        color: #fff;
        background: var(--cobalt);
        box-shadow: 0 12px 24px rgba(36, 84, 255, 0.18);
        cursor: pointer;
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .button:hover { transform: translateY(-2px); background: var(--cobalt-dark); }
      .button:active { transform: translateY(0); box-shadow: none; }
      .button:focus-visible {
        outline: 3px solid rgba(36, 84, 255, 0.28);
        outline-offset: 3px;
      }

      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 36px;
      }

      .theme-card {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 96px;
        border: 1px solid var(--stone);
        border-radius: 18px;
        padding: 20px 24px;
        background: var(--chalk);
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 500ms ease, transform 500ms ease, background 200ms ease, border-color 200ms ease;
      }

      .theme-card:hover {
        background: var(--paper);
        border-color: var(--ink-soft);
      }

      .theme-grid > .theme-card:nth-child(3n+2) {
        margin-top: 24px;
      }

      .theme-card.is-in-view {
        opacity: 1;
        transform: translateY(0);
      }

      .theme-card .mark {
        flex: none;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--chalk);
        background: var(--ink);
        font-family: "Fraunces", Georgia, serif;
        font-weight: 700;
      }

      .theme-card:nth-child(4) .mark {
        color: var(--ink);
        background: var(--highlight);
      }

      .theme-card strong {
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: -0.005em;
      }

      .theme-cta {
        display: flex;
        justify-content: center;
        margin-top: 44px;
      }

      @media (max-width: 980px) {
        .theme-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .theme-grid > .theme-card:nth-child(3n+2) {
          margin-top: 0;
        }
      }

      @media (max-width: 680px) {
        .theme-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .theme-card {
          transition: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <section class="section" id="temas" aria-labelledby="temas-title">
      <div class="inner">
        <span class="eyebrow">O que avaliamos</span>
        <h2 id="temas-title">Sua equipe docente pode precisar de diferentes áreas de formação</h2>
        <div class="theme-grid">
          <article class="theme-card">
            <span class="mark">1</span>
            <strong>Neurociência da Aprendizagem</strong>
          </article>
          <article class="theme-card">
            <span class="mark">2</span>
            <strong>Didática Assimétrica</strong>
          </article>
          <article class="theme-card">
            <span class="mark">3</span>
            <strong>Metodologias Ativas</strong>
          </article>
          <article class="theme-card">
            <span class="mark">4</span>
            <strong>Tecnologias Educacionais/IA</strong>
          </article>
          <article class="theme-card">
            <span class="mark">5</span>
            <strong>Formação Docente</strong>
          </article>
          <article class="theme-card">
            <span class="mark">6</span>
            <strong>Identidade Didática</strong>
          </article>
        </div>
        <div class="theme-cta">
          <a class="button" href="#quiz">Quero descobrir o que minha equipe precisa</a>
        </div>
      </div>
    </section>

    <script>
      (function () {
        var cards = document.querySelectorAll(".theme-card");
        if (!cards.length) return;

        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (reduceMotion || !("IntersectionObserver" in window)) {
          cards.forEach(function (el) { el.classList.add("is-in-view"); });
          return;
        }

        // transition-delay is positional against transition-property (opacity,
        // transform, background, border-color) — background/border-color always
        // get 0ms so the reveal stagger never bleeds into the hover feedback.
        cards.forEach(function (el, i) {
          var delay = (i * 70) + "ms";
          el.style.transitionDelay = delay + ", " + delay + ", 0ms, 0ms";
        });

        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-in-view");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.2, rootMargin: "0px 0px -40px 0px" }
        );

        cards.forEach(function (el) { observer.observe(el); });
      })();
    </script>
  </body>
</html>
